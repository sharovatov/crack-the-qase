<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="./styles.css?v=20260905-1">
    <title>Booth admin · Crack the Qase</title>
  </head>
  <body>
    <header class="admin-header">
      <a class="wordmark" href="/" aria-label="Crack the Qase home">
        <img src="../assets/qase-logo.png" alt="" width="2001" height="607">
      </a>
      <div class="header-context">
        <p class="event-label" id="event-label">StarWest 2026 · Booth 17</p>
        <button class="text-button" id="logout-button" type="button" hidden>Log out</button>
      </div>
    </header>

    <main class="admin-shell">
      <section class="auth-panel" id="auth-panel" aria-labelledby="auth-heading">
        <p class="eyebrow">Staff access</p>
        <h1 id="auth-heading">Booth admin</h1>
        <p class="auth-intro">Sign in with your pre-created staff account.</p>

        <form class="auth-form" id="auth-form">
          <div class="field">
            <label for="staff-email">Staff email</label>
            <input id="staff-email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="staff-password">Password</label>
            <input id="staff-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="primary-button" type="submit">Sign in</button>
          <p class="form-status" id="auth-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="dashboard" id="dashboard" aria-labelledby="dashboard-heading" hidden>
        <div class="dashboard-heading">
          <div>
            <p class="eyebrow">Live booth console</p>
            <h1 id="dashboard-heading">Verify a solve</h1>
          </div>
          <p class="staff-identity" id="staff-identity"></p>
        </div>

        <div class="toolbar">
          <form class="search-form" id="search-form" role="search">
            <label for="registration-search">Find by name or company</label>
            <div class="search-row">
              <input id="registration-search" name="query" type="search" autocomplete="off" placeholder="Start typing…">
              <button class="primary-button" type="submit">Search</button>
            </div>
          </form>
          <div class="view-switcher" aria-label="Registration view">
            <button class="view-button is-active" id="recent-button" type="button" aria-pressed="true">Recent</button>
            <button class="view-button" id="raffle-button" type="button" aria-pressed="false">Raffle-ready</button>
          </div>
        </div>

        <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>

        <div class="workspace">
          <section class="registrations-panel" aria-labelledby="registrations-heading">
            <div class="panel-heading">
              <h2 id="registrations-heading">Recent registrations</h2>
              <span class="count-badge" id="registration-count">0</span>
            </div>
            <div class="registration-list" id="registration-list"></div>
          </section>

          <section class="detail-panel" id="detail-panel" aria-live="polite">
            <div class="empty-detail">
              <p class="empty-mark" aria-hidden="true">⌁</p>
              <h2>Select a participant</h2>
              <p>Choose someone from the list to verify their puzzles.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="../config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
